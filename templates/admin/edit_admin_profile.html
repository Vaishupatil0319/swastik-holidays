<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Edit Admin Profile</title>

<link rel="stylesheet"
href="{{ url_for('static',
filename='css/edit_admin_profile.css') }}">

</head>

<body>

<div class="container">

<div class="header">

<h1>Edit Profile</h1>

<a
href="{{ url_for('admin.admin_profile') }}"
class="back-btn">

← Back

</a>

</div>

{% with messages=get_flashed_messages(with_categories=true) %}

{% if messages %}

{% for category,message in messages %}

<div class="alert {{ category }}">

{{ message }}

</div>

{% endfor %}

{% endif %}

{% endwith %}

<form method="POST">

<div class="form-group">

<label>Name</label>

<input
type="text"
name="name"
value="{{ admin.name }}"
required>

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
name="email"
value="{{ admin.email }}"
required>

</div>

<button type="submit">

Update Profile

</button>

</form>

</div>

</body>

</html>
