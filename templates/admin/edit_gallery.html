<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Edit Gallery Image</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/edit_gallery.css') }}">

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Edit Gallery Image</h1>

        <a href="{{ url_for('admin.manage_gallery') }}"
           class="back-btn">

            ← Back

        </a>

    </div>

    {% with messages=get_flashed_messages(with_categories=true) %}
    {% if messages %}

    {% for category,message in messages %}

    <div class="alert {{ category }}">

        {{ message }}

    </div>

    {% endfor %}

    {% endif %}
    {% endwith %}

    <form
        method="POST"
        enctype="multipart/form-data">

        <div class="form-group">

            <label>Current Image</label>

            <img
            src="{{ url_for('static',
            filename='images/' + gallery.image) }}"
            class="preview">

        </div>

        <div class="form-group">

            <label>Change Image</label>

            <input
                type="file"
                name="image"
                accept="image/*">

        </div>

        <div class="form-group">

            <label>Title</label>

            <input
                type="text"
                name="title"
                value="{{ gallery.title }}"
                required>

        </div>

        <div class="form-group">

            <label>Category</label>

            <select
                name="category"
                required>

                <option value="Beach"
                {% if gallery.category=="Beach" %}selected{% endif %}>
                Beach
                </option>

                <option value="Hill Station"
                {% if gallery.category=="Hill Station" %}selected{% endif %}>
                Hill Station
                </option>

                <option value="Adventure"
                {% if gallery.category=="Adventure" %}selected{% endif %}>
                Adventure
                </option>

                <option value="Hotel"
                {% if gallery.category=="Hotel" %}selected{% endif %}>
                Hotel
                </option>

                <option value="Wildlife"
                {% if gallery.category=="Wildlife" %}selected{% endif %}>
                Wildlife
                </option>

                <option value="Temple"
                {% if gallery.category=="Temple" %}selected{% endif %}>
                Temple
                </option>

                <option value="Other"
                {% if gallery.category=="Other" %}selected{% endif %}>
                Other
                </option>

            </select>

        </div>

        <div class="form-group">

            <label>Description</label>

            <textarea
                name="description"
                rows="5"
                required>{{ gallery.description }}</textarea>

        </div>

        <button type="submit">

            Update Gallery

        </button>

    </form>

</div>

</body>

</html>
