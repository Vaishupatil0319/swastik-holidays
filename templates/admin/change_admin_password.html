<!DOCTYPE html>
<html>

<head>

<title>Change Password</title>

<link rel="stylesheet"
href="{{ url_for('static',
filename='css/change_admin_password.css') }}">

</head>

<body>

<div class="container">

<h2>Change Password</h2>

{% with messages=get_flashed_messages(with_categories=true) %}

{% if messages %}

{% for category,message in messages %}

<div class="alert {{ category }}">

{{ message }}

</div>

{% endfor %}

{% endif %}

{% endwith %}

<form method="POST">

<input
type="password"
name="current_password"
placeholder="Current Password"
required>

<input
type="password"
name="new_password"
placeholder="New Password"
required>

<input
type="password"
name="confirm_password"
placeholder="Confirm Password"
required>

<button>

Update Password

</button>

</form>

<br>

<a
href="{{ url_for('admin.admin_profile') }}">

← Back to Profile

</a>

</div>

</body>

</html>
