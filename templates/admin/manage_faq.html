<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Manage FAQ</title>

<link rel="stylesheet"
href="{{ url_for('static',
filename='css/manage_faq.css') }}">

</head>

<body>

<div class="container">

<div class="header">

<h1>Manage FAQ</h1>

<div>

<a href="{{ url_for('admin.add_faq') }}"
class="add-btn">

+ Add FAQ

</a>

<a href="{{ url_for('admin.dashboard') }}"
class="back-btn">

← Dashboard

</a>

</div>

</div>

<form method="GET" class="search-box">

<input
type="text"
name="search"
placeholder="Search Question..."
value="{{ search }}">

<button type="submit">

Search

</button>

<a href="{{ url_for('admin.manage_faq') }}">

Reset

</a>

</form>

{% if faqs %}

<table>

<thead>

<tr>

<th>ID</th>

<th>Question</th>

<th>Display Order</th>

<th>Status</th>

<th>Created</th>

<th>Action</th>

</tr>

</thead>

<tbody>

{% for faq in faqs %}

<tr>

<td>{{ faq.id }}</td>

<td>{{ faq.question }}</td>

<td>{{ faq.display_order }}</td>

<td>{{ faq.status }}</td>

<td>{{ faq.created_at }}</td>

<td>

<a href="{{ url_for('admin.edit_faq',
faq_id=faq.id) }}"
class="edit-btn">

Edit

</a>

<a href="{{ url_for('admin.delete_faq',
faq_id=faq.id) }}"
class="delete-btn"
onclick="return confirm('Delete this FAQ?')">

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

{% else %}

<div class="empty">

<h2>No FAQ Found</h2>

</div>

{% endif %}

</div>

</body>

</html>
