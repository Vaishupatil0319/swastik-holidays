<!DOCTYPE html>
<html>

<head>

    <title>Edit Coupon</title>

    <link rel="stylesheet"
    href="{{ url_for('static',
    filename='css/add_coupon.css') }}">

</head>

<body>

<div class="container">

<div class="header">

<h1>Edit Coupon</h1>

<a href="{{ url_for('admin.manage_coupons') }}"
class="back-btn">

← Back

</a>

</div>

{% with messages=get_flashed_messages(with_categories=true) %}

{% if messages %}

{% for category,message in messages %}

<div class="alert {{ category }}">

{{ message }}

</div>

{% endfor %}

{% endif %}

{% endwith %}

<form method="POST">

<label>Coupon Code</label>

<input
type="text"
name="coupon_code"
value="{{ coupon.coupon_code }}"
required>

<label>Discount Type</label>

<select name="discount_type">

<option value="Percentage"
{% if coupon.discount_type=="Percentage" %}
selected
{% endif %}>

Percentage

</option>

<option value="Fixed"
{% if coupon.discount_type=="Fixed" %}
selected
{% endif %}>

Fixed

</option>

</select>

<label>Discount Value</label>

<input
type="number"
step="0.01"
name="discount_value"
value="{{ coupon.discount_value }}"
required>

<label>Minimum Booking Amount</label>

<input
type="number"
step="0.01"
name="minimum_amount"
value="{{ coupon.minimum_amount }}">

<label>Expiry Date</label>

<input
type="date"
name="expiry_date"
value="{{ coupon.expiry_date }}"
required>

<label>Usage Limit</label>

<input
type="number"
name="usage_limit"
value="{{ coupon.usage_limit }}"
required>

<button type="submit">

Update Coupon

</button>

</form>

</div>

</body>

</html>
