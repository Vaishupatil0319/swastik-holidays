<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Reset Password</title>

<link rel="stylesheet"
href="{{ url_for('static',
filename='css/reset_password.css') }}">

</head>

<body>

<div class="container">

<h2>Create New Password</h2>

{% with messages=get_flashed_messages(with_categories=true) %}

{% if messages %}

{% for category,message in messages %}

<div class="alert {{ category }}">

{{ message }}

</div>

{% endfor %}

{% endif %}

{% endwith %}

<form method="POST">

<input
type="password"
name="new_password"
placeholder="New Password"
required>

<input
type="password"
name="confirm_password"
placeholder="Confirm Password"
required>

<button type="submit">

Update Password

</button>

</form>

</div>

</body>

</html>
