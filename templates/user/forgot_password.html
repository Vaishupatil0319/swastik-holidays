<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Forgot Password</title>

<link rel="stylesheet"
href="{{ url_for('static',
filename='css/forgot_password.css') }}">

</head>

<body>

<div class="container">

<h2>Forgot Password</h2>

<p>

Enter your registered email address.

</p>

{% with messages =
get_flashed_messages(with_categories=true) %}

{% if messages %}

{% for category, message in messages %}

<div class="alert {{ category }}">

{{ message }}

</div>

{% endfor %}

{% endif %}

{% endwith %}

<form method="POST">

<input
type="email"
name="email"
placeholder="Enter Registered Email"
required>

<button type="submit">

Send OTP

</button>

</form>

<div class="back">

<a href="{{ url_for('user.login') }}">

← Back to Login

</a>

</div>

</div>

</body>

</html>
