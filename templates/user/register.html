<!DOCTYPE html>
<html>
<head>
    <title>Customer Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">
</head>

<body>

<div class="container">

    <h2>Customer Registration</h2>

    <form action="/register" method="POST">

        <input
            type="text"
            name="full_name"
            placeholder="Full Name"
            required>

        <input
            type="email"
            name="email"
            placeholder="Email"
            required>

        <input
            type="text"
            name="mobile"
            placeholder="Mobile Number"
            required>

        <textarea
            name="address"
            placeholder="Address"
            required></textarea>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm Password"
            required>

        <button type="submit">
            Register
        </button>

    </form>

</div>

</body>
</html>
