<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Change Password</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/change_password.css') }}">

</head>

<body>

<div class="container">

<h2>Change Password</h2>

<form method="POST">

<label>Current Password</label>

<input
type="password"
name="current_password"
required>

<label>New Password</label>

<input
type="password"
name="new_password"
required>

<label>Confirm New Password</label>

<input
type="password"
name="confirm_password"
required>

<button type="submit">
Change Password
</button>

</form>

</div>

</body>
</html>
