<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Verify OTP</title>

<link rel="stylesheet"
href="{{ url_for('static',
filename='css/verify_otp.css') }}">

</head>

<body>

<div class="container">

<h2>OTP Verification</h2>

<p>

Enter the 6-digit OTP sent to your email.

</p>

{% with messages=get_flashed_messages(with_categories=true) %}
{% if messages %}

{% for category,message in messages %}

<div class="alert {{ category }}">

{{ message }}

</div>

{% endfor %}

{% endif %}
{% endwith %}

<form method="POST">

<input
type="text"
name="otp"
maxlength="6"
placeholder="Enter OTP"
required>

<button type="submit">

Verify OTP

</button>

</form>

<div class="back">

<a href="{{ url_for('user.forgot_password') }}">

← Back

</a>

</div>

</div>

</body>

</html>
